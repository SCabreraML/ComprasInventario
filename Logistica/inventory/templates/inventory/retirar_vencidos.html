<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Retirar Productos Vencidos</title>
</head>
<body>
    <h1>Retirar Productos Vencidos</h1>
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="producto_id">Producto</label>
        <select name="producto_id" id="producto_id">
            {% for producto in productos %}
                <option value="{{ producto.id }}">{{ producto.codigo }} - {{ producto.nombre }} (Stock bodega: {{ producto.stock_bodega }})</option>
            {% endfor %}
        </select>
        <p>
            <label for="cantidad">Cantidad</label>
            <input type="number" name="cantidad" id="cantidad" min="1" required>
        </p>
        <p>
            <label for="motivo">Motivo</label>
            <input type="text" name="motivo" id="motivo" required>
        </p>
        <p>
            <label for="evidencia">Evidencia</label>
            <input type="text" name="evidencia" id="evidencia">
        </p>
        <button type="submit">Registrar retiro</button>
    </form>
    <a href="/">Volver al dashboard</a>
</body>
</html>
