<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Existencias</title>
</head>
<body>
    <h1>Reporte de Existencias</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Stock Bodega</th>
                <th>Stock Percha</th>
                <th>Stock Mínimo</th>
            </tr>
        </thead>
        <tbody>
            {% for producto in productos %}
                <tr>
                    <td>{{ producto.codigo }}</td>
                    <td>{{ producto.nombre }}</td>
                    <td>{{ producto.stock_bodega }}</td>
                    <td>{{ producto.stock_percha }}</td>
                    <td>{{ producto.stock_minimo }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="/">Volver al dashboard</a>
</body>
</html>
