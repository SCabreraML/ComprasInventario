<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Movimientos de Inventario</title>
</head>
<body>
    <h1>Registrar Movimiento</h1>
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrar movimiento</button>
    </form>
    <a href="/">Volver al dashboard</a>
</body>
</html>
